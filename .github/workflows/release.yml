name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ext: dmg
            label: macOS-AppleSilicon
          - os: windows-2022
            ext: msi
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build installer
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew packageDistributionForCurrentOS

      - name: Rename installer
        shell: bash
        run: |
          cd build/compose/binaries/main/${{ matrix.ext }}
          for f in *.${{ matrix.ext }}; do
            mv "$f" "MyCalculator-${{ matrix.label }}.${{ matrix.ext }}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: build/compose/binaries/main/${{ matrix.ext }}/MyCalculator-${{ matrix.label }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Which file should I download?

            - **Mac (M1, M2, M3 or newer):** `MyCalculator-macOS-AppleSilicon.dmg`
            - **Windows:** `MyCalculator-Windows.msi`

            You can also use the calculator in your browser without installing anything: https://pizzadelivery2009.github.io/kotlin-calc/

            **First launch warnings (the app is not code-signed):**
            - Mac: right-click the app, choose **Open**, then confirm.
            - Windows: click **More info, then Run anyway**.
